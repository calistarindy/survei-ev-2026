<title>Survei Driver Kendaraan Listrik dan Layanan Charger Umum (SPKLU)</title>
<meta name="description" content="Survei untuk driver transportasi online pengguna kendaraan listrik di Jabodetabek. Sekitar 10–12 menit, sebagian besar tinggal pilih jawaban.">
<meta name="theme-color" content="#2340FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0FF; --surface:#FFFFFF; --ink:#141B3D; --muted:#56608A; --line:#CFD8F6;
  --volt:#2340FF; --volt-deep:#1428B8; --volt-ink:#FFFFFF;
  --spark:#FFD23F; --spark-deep:#D9A800; --full:#1FC48A; --low:#FF6B5B; --focus:#FF8A00;
  --press:0 4px 0 #BCC8F0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1433; --surface:#18204F; --ink:#F1F3FF; --muted:#AEB7DE; --line:#2D3A80;
    --volt:#7487FF; --volt-deep:#4A5CDB; --volt-ink:#0E1433;
    --spark:#FFD23F; --spark-deep:#B88E00; --full:#3BE0A8; --low:#FF8577; --focus:#FFB24A;
    --press:0 4px 0 #080C24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1433; --surface:#18204F; --ink:#F1F3FF; --muted:#AEB7DE; --line:#2D3A80;
  --volt:#7487FF; --volt-deep:#4A5CDB; --volt-ink:#0E1433;
  --spark:#FFD23F; --spark-deep:#B88E00; --full:#3BE0A8; --low:#FF8577; --focus:#FFB24A;
  --press:0 4px 0 #080C24;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:12px}

/* Bilah atas: baterai yang terisi seiring jawaban */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 20px 10px}
.battery{display:flex;align-items:center}
.cell{position:relative;width:150px;height:40px;border:3px solid var(--ink);border-radius:11px;padding:3px;overflow:hidden;background:var(--surface)}
.fill{height:100%;width:0;border-radius:6px;background:var(--low);transition:width .5s cubic-bezier(.2,.8,.2,1),background-color .4s}
.bolt{position:absolute;inset:0;margin:auto;width:20px;height:26px;fill:var(--ink);opacity:.85}
.cap{width:7px;height:16px;background:var(--ink);border-radius:0 4px 4px 0;margin-left:2px}
.pct{font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;font-size:19px;min-width:4.2ch}
.demo{max-width:540px;margin:0 auto 4px;padding:0 20px;font-size:13px;color:var(--muted);text-align:center}

.wrap{max-width:540px;margin:0 auto;padding:4px 20px 140px}

/* Layar pembuka */
.hero{text-align:center;padding-top:8px}
.mascot{width:150px;height:150px;display:block;margin:6px auto 0}
.hero h1.judul-panjang{font-size:23px;line-height:1.12}
.hero h1{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:31px;line-height:1.05;margin:8px 0 12px;letter-spacing:-.01em}
.hero p{margin:0 auto 10px;max-width:34ch;color:var(--muted)}
.facts{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.facts li{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:600}
.consent{display:flex;gap:12px;align-items:flex-start;text-align:left;margin:20px 0 0;padding:14px 16px;background:var(--surface);border:2px solid var(--line);border-radius:16px;font-weight:600;cursor:pointer}
.consent input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--volt)}
.small{font-size:14px;color:var(--muted);margin-top:14px}

/* Pertanyaan */
.sec{margin:14px 0 6px;font-size:15px;font-weight:700;color:var(--volt)}
.q-title{font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;font-size:27px;line-height:1.15;margin:0 0 6px}
.q-title:focus{outline:none}
.hint{margin:0 0 4px;color:var(--muted);font-size:15px}
.opts{display:grid;gap:12px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 16px;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:18px;box-shadow:var(--press);
  font-weight:600;font-size:17px;transition:transform .08s,box-shadow .08s,background-color .15s}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt[aria-pressed="true"]{background:var(--volt);border-color:var(--volt);color:var(--volt-ink);box-shadow:0 4px 0 var(--volt-deep)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.emo{font-size:26px;width:34px;text-align:center;flex:none;line-height:1}
.tick{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:15px}
.opt[aria-pressed="true"] .tick{border-color:var(--volt-ink);background:var(--volt-ink);color:var(--volt)}
.multi .tick{border-radius:8px}
.card{align-items:flex-start;padding:16px}
.card .emo{font-size:32px;width:40px}
.card-t{font-family:"Baloo 2",system-ui,sans-serif;font-size:21px;font-weight:700;line-height:1.15;display:block}
.card-l{display:block;font-weight:500;font-size:15px;opacity:.85;margin-top:2px}
.count{margin-top:12px;font-size:15px;font-weight:600;color:var(--muted)}
.grow{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px}
.grow.done{border-color:var(--volt)}
.glabel{margin:0 0 10px;font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 14px;min-height:44px;border:2px solid var(--line);border-radius:999px;background:var(--bg);font-size:15px;font-weight:600}
.pills.likert{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pills.likert .pill{padding:6px 0;min-height:52px;text-align:center;font-family:"Baloo 2",system-ui,sans-serif;font-size:24px;font-weight:700;border-radius:14px}
.pill.na{width:100%;margin-top:10px;font-size:14px;min-height:42px}
.pill.na[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ends{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:13px;color:var(--muted);font-weight:600}
.pill[aria-pressed="true"]{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
.field{width:100%;margin-top:18px;padding:14px 16px;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:16px}
.field:focus{border-color:var(--volt);outline:none}
textarea.field{min-height:120px;resize:vertical}
.err{color:var(--low);font-weight:600;font-size:15px;margin-top:8px}

/* Layar konsep layanan */
.konsep-ilus{display:block;width:100%;max-width:340px;height:auto;margin:14px auto 4px}
.konsep-isi{color:var(--muted);margin:0 0 6px}
.feats{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.feat{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.feat .emo{font-size:28px}
.feat-t{display:block;font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;font-size:20px;line-height:1.2}
.feat-d{display:block;font-size:15px;color:var(--muted)}

/* Navigasi bawah */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:2px solid var(--line);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:540px;margin:0 auto;display:flex;gap:12px;align-items:center}
.back{background:none;border:none;padding:12px 8px;font-weight:700;color:var(--muted);min-height:52px}
.next{flex:1;min-height:56px;border:none;border-radius:18px;background:var(--spark);color:#141B3D;
  font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:21px;box-shadow:0 4px 0 var(--spark-deep);transition:transform .08s,box-shadow .08s}
.next:active{transform:translateY(3px);box-shadow:none}
.next[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--spark-deep)}

/* Layar akhir */
.end{text-align:center;padding-top:20px}
.end h1{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:36px;line-height:1.05;margin:10px 0}
.end p{color:var(--muted);max-width:34ch;margin:0 auto 10px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-24px;width:10px;height:16px;border-radius:3px;animation:fall 1.9s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}

/* Panel admin */
.admin{padding-top:20px}
.admin h1{font-family:"Baloo 2",system-ui,sans-serif;font-size:32px;margin:0 0 8px}
.admin label{display:block;font-weight:700;margin-top:18px}
.btn{margin-top:16px;width:100%;min-height:56px;border:none;border-radius:18px;background:var(--volt);color:var(--volt-ink);font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--volt-deep)}
.status{margin-top:14px;font-weight:600}

@media (min-width:600px){.q-title{font-size:31px}.hero h1{font-size:40px}.hero h1.judul-panjang{font-size:30px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

 }

const params = new URLSearchParams(location.search);
const KANAL = (params.get('kanal') || 'langsung').replace(/[^\w-]/g, '').slice(0, 40) || 'langsung';
const ADMIN = params.has('admin');
const KEY_ANTREAN = 'survei-ev-antrean';

const st = { screen: 'welcome', idx: 0, ans: {}, start: 0, consent: false, sent: '', order: {}, other: {}, status: '', kontak: '' };

/* ---------- penyimpanan lokal (aman bila diblokir) ---------- */
function bacaAntrean() { try { return JSON.parse(localStorage.getItem(KEY_ANTREAN) || '[]'); } catch (e) { return []; } }
function simpanAntrean(list) { try { localStorage.setItem(KEY_ANTREAN, JSON.stringify(list)); } catch (e) { /* abaikan */ } }

/* ---------- alur ---------- */
function stem(v) { return v.replace(/,?\s*\(?sebutkan\)?/i, '').trim(); }
/* Responden keluar bila memilih opsi bertanda end (di luar populasi survei). */
function opsiTerpilih(q) { return (q.options || []).find(o => o.v === st.ans[q.id]); }
function terlempar() { return Q.find(q => q.type === 'single' && (opsiTerpilih(q) || {}).end); }
function jalur() {
  if (terlempar()) return 'none';
  return st.ans.P0 ? 'ev' : null;
}
function kondisiOk(q, optimis) {
  if (!q.when) return true;
  const w = q.when, a = st.ans[w.id];
  if (!a) return w.unanswered ? true : !!optimis;   // belum dijawab: tampil hanya bila memang diizinkan
  if (w.eq) return w.eq.includes(a);
  if (w.ne) return !w.ne.includes(a);
  return true;
}
function tampil(q, optimis) {
  const p = jalur();
  if (q.path === 'all') return true;
  if (p === 'none') return st.ans[q.id] !== undefined;   // yang sudah dijawab tetap ada, termasuk pertanyaan penyaring yang mengeluarkan
  if (!p && !optimis) return false;
  return kondisiOk(q, optimis);
}
function alur() { return Q.filter(q => tampil(q, false)); }
function totalLayar() { return jalur() === 'none' ? alur().length : Q.filter(q => tampil(q, true)).length; }
function terjawab(q) {
  const a = st.ans[q.id];
  if (q.type === 'concept' || q.required === false) return true;
  if (q.type === 'multi') return Array.isArray(a) && a.length > 0;
  if (q.type === 'grid') return !!a && q.rows.every(r => a[r.k]);
  return !!a;
}
function acak(arr) {
  const o = arr.slice();
  for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
  return o;
}
/* Opsi bertanda fix tetap di akhir; sisanya diacak sekali per responden. */
function urutan(q) {
  if (!q.shuffle) return q.options;
  if (!st.order[q.id]) st.order[q.id] = acak(q.options.filter(o => !o.fix && !o.other)).concat(q.options.filter(o => o.other), q.options.filter(o => o.fix));
  return st.order[q.id];
}
function urutanBaris(q) {
  if (!q.shuffleRows) return q.rows;
  const k = q.id + '_r';
  if (!st.order[k]) st.order[k] = acak(q.rows);
  return st.order[k];
}

/* ---------- pembantu DOM ---------- */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}

/* ---------- baterai ---------- */
function setBaterai(pct) {
  const fill = document.getElementById('fill');
  fill.style.width = pct + '%';
  fill.style.backgroundColor = pct < 34 ? 'var(--low)' : pct < 67 ? 'var(--spark)' : 'var(--full)';

/* ---------- layar ---------- */
function render() {
  const app = document.getElementById('app');

  if (ADMIN) return layarAdmin(app);
  if (st.screen === 'welcome') layarPembuka(app);
  else if (st.screen === 'q') layarPertanyaan(app);

}

function layarPembuka(app) {

    el('ul', { class: 'facts' }, el('li', {}, '⏱️ Sekitar 10–12 menit'), el('li', {}, '👆 Sebagian besar tinggal pilih'), el('li', {}, '🙈 Tanpa nama')),
    el('p', { class: 'small' }, 'Survei ini tidak meminta nama dan tidak ada jawaban benar atau salah. Jawablah berdasarkan pengalaman Anda sendiri. Data akan dianalisis untuk keperluan riset.')

function layarPertanyaan(app) {
  const list = alur();
  const q = list[st.idx];
  const total = Math.max(totalLayar(), 1);
  setBaterai(Math.min(100, Math.round(st.idx / total * 100)));

  const judul = el('h1', { class: 'q-title', tabindex: '-1' }, q.text);

    next.disabled = !terjawab(q);

  };

  if (q.type === 'concept') {

  }

  if (q.type === 'single' || q.type === 'cards') {
    const opts = el('div', { class: 'opts', role: 'group', 'aria-label': q.text });

    const ketSingle = adaLain ? el('input', { class: 'field', type: 'text', maxlength: '80', placeholder: 'Tulis singkat', 'aria-label': 'Sebutkan lainnya', value: st.other[q.id] || '',
      oninput: e => { st.other[q.id] = e.target.value.trim(); } }) : null;
    if (ketSingle) ketSingle.hidden = !(opsiTerpilih(q) || {}).other;
    const adaKontak = q.options.some(o => o.kontak);
    const kotakKontak = adaKontak ? el('div', {}, el('input', { class: 'field', type: 'text', maxlength: '80', placeholder: 'Nomor WhatsApp atau email (boleh dikosongkan)', 'aria-label': 'Kontak untuk wawancara lanjutan', value: st.kontak || '',
        oninput: e => { st.kontak = e.target.value.trim(); } }),
      el('p', { class: 'small' }, 'Kontak disimpan terpisah dan tidak digabung dengan jawaban survei.')) : null;
    if (kotakKontak) kotakKontak.hidden = !(opsiTerpilih(q) || {}).kontak;
    urutan(q).forEach(o => {
      const on = st.ans[q.id] === o.v;
      const isi = q.type === 'cards'
        ? [el('span', { class: 'emo' }, o.e || ''), el('span', {}, el('span', { class: 'card-t' }, o.t), ...(o.l || []).map(x => el('span', { class: 'card-l' }, x)))]
        : [o.e ? el('span', { class: 'emo' }, o.e) : null, el('span', {}, o.v), el('span', { class: 'tick', 'aria-hidden': 'true' }, on ? '✓' : '')];
      opts.append(el('button', {
        class: 'opt' + (q.type === 'cards' ? ' card' : ''), 'aria-pressed': on ? 'true' : 'false',
        onclick: (e) => {
          st.ans[q.id] = o.v;
          [...opts.children].forEach(b => {
            b.setAttribute('aria-pressed', 'false');
            const t = b.querySelector('.tick'); if (t) t.textContent = '';
          });
          const btn = e.currentTarget;
          btn.setAttribute('aria-pressed', 'true');
          const t = btn.querySelector('.tick'); if (t) t.textContent = '✓';
          if (ketSingle) { ketSingle.hidden = !o.other; if (o.other) ketSingle.focus(); }
          if (kotakKontak) kotakKontak.hidden = !o.kontak;
          segarkanNext();
          clearTimeout(st.timer);
          if (o.other) return;   // beri waktu mengetik, lanjut lewat tombol
          const di = st.idx;
          st.timer = setTimeout(() => { if (st.screen === 'q' && st.idx === di) maju(); }, 280);
        }
      }, ...isi));
    });
    box.append(opts);
    if (ketSingle) box.append(ketSingle);
    if (kotakKontak) box.append(kotakKontak);
  }

  if (q.type === 'multi') {
    const max = q.max || 99;
    const pilih = st.ans[q.id] || [];
    const opts = el('div', { class: 'opts multi', role: 'group', 'aria-label': q.text });
    const hitung = el('p', { class: 'count' });
    const xs = new Set(q.options.filter(o => o.x).map(o => o.v));

    const ketMulti = lain ? el('input', { class: 'field', type: 'text', maxlength: '80', placeholder: 'Tulis singkat', 'aria-label': 'Sebutkan lainnya', value: st.other[q.id] || '',
      oninput: e => { st.other[q.id] = e.target.value.trim(); } }) : null;
    const segarkan = () => {
      const now = st.ans[q.id] || [];
      if (ketMulti) ketMulti.hidden = !now.includes(lain.v);
      const adaX = now.some(v => xs.has(v));
      [...opts.children].forEach(b => {
        const on = now.includes(b.dataset.v);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');

        b.disabled = !on && !xs.has(b.dataset.v) && !adaX && now.length >= max;
      });
      hitung.textContent = q.max ? now.length + ' dari ' + max + ' dipilih' : now.length + ' dipilih';
      segarkanNext();
    };
    urutan(q).forEach(o => {
      opts.append(el('button', {
        class: 'opt', 'data-v': o.v, 'aria-pressed': pilih.includes(o.v) ? 'true' : 'false',
        onclick: () => {
          let now = (st.ans[q.id] || []).slice();
          const i = now.indexOf(o.v);
          if (xs.has(o.v)) now = i >= 0 ? [] : [o.v];
          else {
            now = now.filter(v => !xs.has(v));
            const j = now.indexOf(o.v);
            if (j >= 0) now.splice(j, 1); else if (now.length < max) now.push(o.v);
          }

  }

  if (q.type === 'grid') {
    const wrap = el('div', { class: 'opts' });
    const a = st.ans[q.id] || (st.ans[q.id] = {});
    urutanBaris(q).forEach(r => {
      const row = el('div', { class: 'grow' + (a[r.k] ? ' done' : ''), role: 'group', 'aria-label': r.v });

      const tombolNa = q.na ? el('button', {
        class: 'pill na', 'aria-pressed': a[r.k] === q.na ? 'true' : 'false',
        onclick: () => {
          a[r.k] = q.na;
          [...pills.children].forEach(b => b.setAttribute('aria-pressed', 'false'));

          row.classList.add('done');
          segarkanNext();
        }
      }, q.na) : null;
      if (tombolNa) pills.querySelectorAll('.pill').forEach(b => b.addEventListener('click', () => tombolNa.setAttribute('aria-pressed', 'false')));
      row.append(el('p', { class: 'glabel' }, r.v), pills, q.likert ? el('div', { class: 'ends', 'aria-hidden': 'true' }, el('span', {}, '1 = ' + q.likert.min), el('span', {}, '4 = ' + q.likert.max)) : null, tombolNa);
      wrap.append(row);
    });

  }

  if (q.type === 'text') {
    box.append(el('textarea', {
      class: 'field', maxlength: '300', placeholder: 'Tulis singkat saja', 'aria-label': q.text,
      oninput: e => { st.ans[q.id] = e.target.value.trim(); segarkanNext(); }
    }, st.ans[q.id] || ''));
  }

  app.append(box);
  segarkanNext();
  const back = el('button', { class: 'back', onclick: mundur }, 'Kembali');
  navigasi([back, next]);
  judul.focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
}

function maju() {
  clearTimeout(st.timer);
  const list = alur();
  const q = list[st.idx];
  if (!q || !terjawab(q)) return;
  if (q.type === 'single' && (opsiTerpilih(q) || {}).end) { st.status = 'keluar_' + q.id; kirim(); st.screen = 'notev'; return render(); }
  if (st.idx < alur().length - 1) { st.idx++; render(); }
  else { kirim(); st.screen = 'end'; render(); }
}
function mundur() {
  clearTimeout(st.timer);
  if (st.idx === 0) { st.screen = 'welcome'; } else { st.idx--; }
  render();
}

function navigasi(btns) {
  const nav = document.getElementById('nav');
  nav.hidden = !btns.length;
  document.getElementById('navIn').replaceChildren(...btns);
}

function layarAkhir(app) {
  setBaterai(100);
  navigasi([]);
  const bukanEv = st.screen === 'notev';
  const pesan = !KONFIG.SCRIPT_URL ? 'Mode uji: jawaban ini tidak dikirim ke spreadsheet.'
    : st.sent === 'ok' ? 'Jawaban Anda sudah terkirim.'
    : st.sent === 'antre' ? 'Sinyal sedang lemah. Jawaban tersimpan di ponsel ini dan akan dikirim lagi otomatis saat halaman ini dibuka kembali.'
    : 'Sedang mengirim jawaban...';
  app.append(el('section', { class: 'end' },
    maskot(true),
    el('h1', {}, bukanEv ? 'Terima kasih sudah mampir!' : 'Terima kasih, Bapak/Ibu/Kak!'),
    el('p', {}, st.status === 'keluar_P0' ? 'Terima kasih atas waktunya. Anda memilih tidak berpartisipasi.'
      : bukanEv ? 'Survei ini khusus driver transportasi online aktif di Jabodetabek yang memakai kendaraan listrik untuk bekerja dan berusia 17 tahun ke atas.'
      : 'Jawaban Anda membantu kami memahami pengalaman driver dan merumuskan perbaikan layanan charger umum.'),
    el('p', { class: 'small', id: 'statusKirim' }, pesan)
  ));
  if (!bukanEv) konfeti();
}

function konfeti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = el('div', { class: 'confetti', 'aria-hidden': 'true' });
  const warna = ['var(--volt)', 'var(--spark)', 'var(--full)', 'var(--low)'];
  for (let i = 0; i < 46; i++) {
    const p = el('i');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = warna[i % warna.length];
    p.style.animationDelay = Math.random() * .5 + 's';
    p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    box.append(p);
  }
  document.body.append(box);
  setTimeout(() => box.remove(), 2800);
}

/* ---------- pengiriman ---------- */
function idAcak() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function payload() {
  const j = jalur();
  const p = {
    id_respons: idAcak(), kanal: KANAL,
    jalur: j === 'ev' ? ({ 'Mobil listrik': 'mobil', 'Motor listrik': 'motor' }[st.ans.A4] || 'ev') : 'keluar',
    durasi_detik: Math.round((Date.now() - st.start) / 1000), persetujuan: st.ans.P0 === 'Ya, bersedia' ? 'Ya' : 'Tidak', status_saring: st.status || 'lolos'
  };
  const nilai = (q, v) => { const o = (q.options || []).find(x => x.v === v); return o && o.other ? (stem(v) + (st.other[q.id] ? ': ' + st.other[q.id] : '')) : v; };
  const daftar = j === 'ev' ? alur() : Q.filter(q => st.ans[q.id] !== undefined);
  daftar.forEach(q => {
    if (q.type === 'concept') return;
    const a = st.ans[q.id];
    if (q.type === 'grid') q.rows.forEach(r => { p[q.key + '_' + r.k] = (a && a[r.k]) || ''; });
    else if (q.type === 'multi') p[q.key] = (a || []).map(v => nilai(q, v)).join('; ');
    else p[q.key] = a ? nilai(q, a) : '';
  });
  return p;
}
function kirimSatu(data) {
  return fetch(KONFIG.SCRIPT_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data)
  });
}
async function kirim() {
  if (!KONFIG.SCRIPT_URL) return;
  const data = payload();
  const baru = [data];
  if (st.ans.Z3 === 'Bersedia' && st.kontak) baru.push({ tipe: 'kontak', kontak: st.kontak });
  simpanAntrean(bacaAntrean().concat(baru));
  st.sent = '';
  await kirimAntrean();
  const status = document.getElementById('statusKirim');
  if (status) status.textContent = st.sent === 'ok' ? 'Jawaban Anda sudah terkirim.'
    : 'Sinyal sedang lemah. Jawaban tersimpan di ponsel ini dan akan dikirim lagi otomatis saat halaman ini dibuka kembali.';
}
async function kirimAntrean() {
  let list = bacaAntrean();
  for (const item of list.slice()) {
    try {
      await kirimSatu(item);
      list = list.filter(x => x !== item);
      simpanAntrean(list);
      st.sent = 'ok';
    } catch (e) {
      st.sent = 'antre';
      return;
    }
  }
}

/* ---------- panel admin: unduh Excel ---------- */
function layarAdmin(app) {
  setBaterai(100);
  navigasi([]);
  const kunci = el('input', { class: 'field', type: 'password', placeholder: 'Kunci admin', autocomplete: 'off' });
  const status = el('p', { class: 'status', role: 'status' });
  const tombol = el('button', { class: 'btn', onclick: () => unduhExcel(kunci.value, status) }, 'Unduh Excel respons');
  app.append(el('section', { class: 'admin' },
    el('h1', {}, 'Rekap respons'),
    el('p', { class: 'hint' }, 'Mengambil semua jawaban dari website dan Google Form, lalu menyimpannya sebagai satu file Excel dengan dua sheet.'),
    el('label', {}, 'Kunci admin', kunci), tombol, status));
}
function muatSheetJS() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res; s.onerror = () => rej(new Error('SheetJS gagal dimuat'));
    document.head.append(s);
  });
}
async function unduhExcel(kunci, status) {
  if (!KONFIG.SCRIPT_URL) { status.textContent = 'URL Apps Script belum diisi di KONFIG.'; return; }
  status.textContent = 'Mengambil data...';
  try {
    const [res] = await Promise.all([fetch(KONFIG.SCRIPT_URL + '?key=' + encodeURIComponent(kunci)), muatSheetJS()]);
    const data = await res.json();
    if (!data.ok) { status.textContent = data.error || 'Kunci salah.'; return; }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data.website.length ? data.website : [['Belum ada data']]), 'Website');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data.form.length ? data.form : [['Belum ada data']]), 'Google Form');
    const tgl = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, 'respons-survei-driver-ev-' + tgl + '.xlsx');
    status.textContent = 'Selesai: ' + Math.max(data.website.length - 1, 0) + ' jawaban website dan ' + Math.max(data.form.length - 1, 0) + ' jawaban Google Form.';
  } catch (e) {
    status.textContent = 'Gagal mengambil data. Cek URL Apps Script, atau unduh langsung dari Google Sheet (File, Download, Microsoft Excel).';
  }
}

render();
if (KONFIG.SCRIPT_URL && !ADMIN) kirimAntrean();
</script>
